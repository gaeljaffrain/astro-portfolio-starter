<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#101a2c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0%" stop-color="#dfe9ff"/>
      <stop offset="100%" stop-color="#8ca7d8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- outer head -->
  <rect x="12" y="17" width="40" height="32" rx="11" fill="url(#metal)"/>

  <!-- side antennas -->
  <rect x="19" y="8" width="3" height="12" rx="1.5" fill="#8feaff"/>
  <rect x="42" y="8" width="3" height="12" rx="1.5" fill="#8feaff"/>
  <circle cx="20.5" cy="6" r="3" fill="#6ef4ff"/>
  <circle cx="43.5" cy="6" r="3" fill="#6ef4ff"/>

  <!-- visor -->
  <rect x="20" y="25" width="24" height="12" rx="6" fill="#0a1628"/>
  <rect x="23" y="28" width="18" height="6" rx="3" fill="#82f7df" fill-opacity="0.9"/>

  <!-- eye slits -->
  <rect x="24" y="30" width="7" height="2.5" rx="1.25" fill="#0b0f1d"/>
  <rect x="33" y="30" width="7" height="2.5" rx="1.25" fill="#0b0f1d"/>

  <!-- jaw / mouth -->
  <rect x="23" y="40" width="18" height="4" rx="2" fill="#0b0f1d"/>
  <rect x="27" y="44" width="10" height="2.5" rx="1.25" fill="#6ef4ff"/>

  <!-- neck -->
  <rect x="29" y="49" width="6" height="9" rx="2" fill="#b9c8ea"/>
</svg>
